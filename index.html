    // --- MAIN APP COMPONENT ---

      const [searchTerm, setSearchTerm] = useState("");
      const [darkMode, setDarkMode] = useState(false);
      
      // Flashcards state

        if (flashcardFilter === "all") return flashcardsData;
        return flashcardsData.filter(card => card.cat === flashcardFilter);
      }, [flashcardFilter]);

      const activeCard = filteredFlashcards[currentCardIndex] || filteredFlashcards[0];

      const handleNextCard = () => {
        setIsFlipped(false);
        setCurrentCardIndex((prev) => (prev + 1) % filteredFlashcards.length);
      };

      const handlePrevCard = () => {
        setIsFlipped(false);
        setCurrentCardIndex((prev) => (prev - 1 + filteredFlashcards.length) % filteredFlashcards.length);
      };

      const toggleMastered = (cardId) => {
        if (masteredCards.includes(cardId)) {

                    <button
                      key={key}
                      onClick={() => { setActiveTab(key); setSearchTerm(""); }}
                      className={`w-full flex items-center space-x-3 space-x-reverse px-4 py-3 rounded-xl transition-all duration-200 text-base font-bold ${
                        isActive 
                          ? ${isRover ? 'bg-red-700 shadow-red-900/50' : item.badgeColor} text-white shadow-lg transform -translate-x-1 
                          : isRover
                          ? "text-red-400 hover:bg-red-950/40 hover:text-red-300"
                          : "text-slate-300 hover:bg-slate-800 hover:text-white"

                    >
                      <i className={fa-solid ${item.icon} w-6 text-center text-lg ${isRover && !isActive ? 'text-red-500' : ''}}></i>
                      <span className="truncate">{item.title}</span>
                    </button>

              </button>
            </div>
          </aside>

          {/* MAIN CONTENT AREA */}

            {/* Top Header & Search Bar */}

                        <div>

                          <h2 className="text-3xl md:text-4xl font-black mb-1">{scoutData[activeTab].title}</h2>

                        </div>
                      </div>
                    </div>

                    {/* Section Items - Full Word Document View */}
                    <div className="space-y-8">
                      {scoutData[activeTab].sections.map((sec) => (
                        <div key={sec.id} className="word-doc-page p-6 md:p-10 rounded-3xl shadow-sm transition hover:shadow-md border border-slate-200 dark:border-slate-800">
                          
                          <h3 className={text-2xl font-bold mb-6 pb-3 border-b-2 ${activeTab === 'rovers' ? 'text-red-700 dark:text-red-400 border-red-600' : 'text-slate-900 dark:text-white border-amber-500'} flex items-center justify-between}>
                            <span className="flex items-center">
                              <span className={w-3 h-8 rounded-full ${activeTab === 'rovers' ? 'bg-red-600' : 'bg-amber-500'} inline-block ml-3}></span>
                              {sec.title}
                            </span>
                            {activeTab === 'rovers' && (
                              <span className="text-xs bg-red-100 dark:bg-red-950 text-red-700 dark:text-red-300 font-cairo px-3 py-1 rounded-full border border-red-300">
                                قسم الأحمر
                              </span>
                            )}
                          </h3>

                          {/* FLEUR DE LIS VISUAL SVG GRAPHIC */}
                          {sec.svgType === 'fleur-de-lis' && (
                            <div className="my-6 p-6 rounded-2xl bg-amber-50 dark:bg-slate-900 border border-amber-200 dark:border-slate-800 text-center flex flex-col items-center">
                              <div className="w-32 h-32 flex items-center justify-center text-amber-600 text-7xl my-2 animate-bounce">
                                ⚜️
                              </div>
                              <p className="text-sm font-bold font-cairo text-amber-800 dark:text-amber-400">زنبقة الكشافة العالمية - رمز الاتجاه نحو الخير والأركان الثلاثة</p>

                            <div className="my-6 p-6 rounded-2xl bg-red-50 dark:bg-slate-900 border border-red-200 dark:border-slate-800 text-center flex flex-col items-center">

                            </div>
                          )}

                          {/* Standard Text Content */}
                          {sec.content && (
                            <div className="text-slate-800 dark:text-slate-200 text-lg md:text-xl leading-relaxed whitespace-pre-line mb-6 font-amiri">
                              {sec.content}

                          {/* Timeline display for BP story */}
                          {sec.timeline && (

                          {/* Promise & Law UI */}
                          {sec.promise && sec.law && (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                              <div className="p-6 rounded-2xl bg-amber-50 dark:bg-amber-950/40 border border-amber-300 dark:border-amber-900">
                                <h4 className="font-bold text-amber-800 dark:text-amber-400 mb-4 text-xl border-b border-amber-200 pb-2">الوعد الكشفي:</h4>
                                <ul className="space-y-3 text-lg text-slate-800 dark:text-slate-200">
                                  {sec.promise.map((p, i) => <li key={i} className="font-bold">{p}</li>)}
                                </ul>
                              </div>

                              <div className="p-6 rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-300 dark:border-emerald-900">
                                <h4 className="font-bold text-emerald-800 dark:text-emerald-400 mb-4 text-xl border-b border-emerald-200 pb-2">القانون الكشفي (10 بنود):</h4>
                                <ul className="space-y-2 text-base md:text-lg text-slate-800 dark:text-slate-200">
                                  {sec.law.map((l, i) => <li key={i}>{l}</li>)}
                                </ul>
                              </div>
                            </div>
                          )}

                          {/* BP Quote Display */}
                          {sec.quote && (
                            <div className="p-8 rounded-3xl bg-amber-50/80 dark:bg-slate-800/80 border-r-8 border-amber-500 text-slate-900 dark:text-slate-100 text-lg md:text-xl leading-relaxed italic my-6 shadow-inner">
                              <i className="fa-solid fa-quote-right text-amber-500 text-3xl block mb-3"></i>
                              <p className="whitespace-pre-line font-amiri font-bold">{sec.quote}</p>
                            </div>
                          )}

                          {/* Rank Badges Visual Simulator */}
                          {sec.badgesData && (
                            <div className="mt-8">
                              <p className="text-sm font-cairo text-slate-600 dark:text-slate-300 mb-4 p-4 rounded-xl bg-amber-50 dark:bg-slate-800 border border-amber-200">
                                📌 <strong>قواعد حفظ الشارات:</strong> {sec.rulesText}
                              </p>
                              
                              <div className="p-3 rounded-xl bg-slate-100 dark:bg-slate-800 mb-6 flex flex-wrap gap-2 font-cairo">
                                <span className="text-xs font-bold text-slate-500 self-center ml-2">اختر الهيئة:</span>
                                {["الهيئة الإدارية", "المفوضية العامة", "الأفواج والوحدات"].map(cat => (
                                  <button
                                    key={cat}
                                    onClick={() => setBadgeCategory(cat)}
                                    className={`px-4 py-2 rounded-xl text-xs font-bold transition ${
                                      badgeCategory === cat ? "bg-red-600 text-white shadow" : "bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300"
                                    }`}
                                  >
                                    {cat}
                                  </button>
                                ))}
                              </div>

                              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                                {sec.badgesData
                                  .filter(b => b.category === badgeCategory)
                                  .map((badge, idx) => (
                                    <div key={idx} className="p-4 rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40 flex items-center space-x-3 space-x-reverse">
                                      <div className={w-14 h-14 rounded-2xl ${badge.bg} flex items-center justify-center font-bold text-xs shadow-md text-center p-1 flex-shrink-0 font-cairo}>
                                        شارة
                                      </div>
                                      <div>
                                        <h5 className="font-bold text-base text-slate-900 dark:text-slate-100">{badge.name}</h5>
                                        <p className="text-xs font-cairo text-slate-500 dark:text-slate-400 mt-1">{badge.detail}</p>
                                      </div>
                                    </div>
                                  ))}
                              </div>
                            </div>
                          )}

                          {/* Formations Visual Cards */}
                          {sec.formations && (
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 mt-8">
                              {sec.formations.map((f, i) => (
                                <div key={i} className="p-5 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-800 text-center flex flex-col justify-between">
                                  <div>
                                    <div className="w-12 h-12 mx-auto rounded-full bg-red-600 text-white flex items-center justify-center font-bold text-base mb-3 shadow">
                                      {i + 1}
                                    </div>
                                    <h5 className="font-bold text-lg text-slate-900 dark:text-slate-100 mb-1">{f.name}</h5>
                                    <p className="text-xs font-cairo font-bold text-red-600 dark:text-red-400 mb-3">{f.gesture}</p>
                                  </div>
                                  <p className="text-xs font-cairo text-slate-600 dark:text-slate-400">{f.desc}</p>
                                </div>
                              ))}
                            </div>
                          )}

                          {/* Generic List Rendering */}
                          {sec.list && (
                            <div className="space-y-4 mt-6">
                              {sec.list.map((item, i) => (
                                <div key={i} className="p-5 rounded-2xl bg-slate-50 dark:bg-slate-800/40 border border-slate-200 dark:border-slate-800">
                                  <h5 className="font-bold text-lg text-red-700 dark:text-red-400">{item.title || item.name}</h5>
                                  <p className="text-base text-slate-700 dark:text-slate-300 mt-1">{item.req || item.target}</p>
                                </div>
                              ))}
                            </div>
                          )}

                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
